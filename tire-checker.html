<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка шин — АвтоШтурман</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>.status-safe { color: #00FF9D; } .status-danger { color: #FF4D4D; font-weight: bold; }</style>
</head>
<body>
<div class="container">
<header style="margin-bottom:20px"><a href="index.html" style="color:var(--accent-neon);font-weight:bold;text-decoration:none">← На главную</a></header>
<h1 class="gold-text">🛞 Проверка индекса нагрузки шин</h1>
<p class="subtitle">Безопасность превыше всего. Хватит ли прочности ваших покрышек?</p>

<!-- ИСПРАВЛЕНО: Локальная картинка hero-auto.jpg -->
<img src="hero-auto.jpg" alt="АвтоШтурман" style="width:100%; height:250px; object-fit:cover; border-radius:16px; margin-bottom:30px;">

<div class="calc-wrapper">
    <div class="grid-inputs">
        <div class="input-group">
            <label>Снаряженная масса авто (кг)</label>
            <input type="number" id="carWeight" value="1500">
        </div>
        <div class="input-group">
            <label>Индекс нагрузки шины (цифра после размера, напр. 91)</label>
            <input type="number" id="tireIndex" value="91">
        </div>
    </div>
    <button onclick="checkTire()" class="btn-link" style="width:100%; margin-top:20px;">Проверить совместимость</button>
    <div id="tireRes" class="result-box show" style="display:none;"></div>
</div>
<footer>© 2026 АвтоШтурман</footer>
</div>
<script>
const LOAD_TABLE = { 80:450, 85:515, 90:600, 91:615, 92:630, 94:670, 95:690, 98:750, 100:800 };

function checkTire() {
    const weight = parseFloat(document.getElementById('carWeight').value);
    const idx = parseInt(document.getElementById('tireIndex').value);
    
    const tireCapacity = LOAD_TABLE[idx] || (idx * 10 - 200); 
    const loadPerTire = weight / 4;
    
    let msg = "";
    let cls = "";
    
    if (tireCapacity >= loadPerTire) {
        msg = `✅ БЕЗОПАСНО. Шина выдерживает ${tireCapacity} кг. Нагрузка на колесо ~${Math.round(loadPerTire)} кг.`;
        cls = "status-safe";
    } else {
        msg = `⚠️ ОПАСНО! Шина (${tireCapacity} кг) слабее расчетной нагрузки (${Math.round(loadPerTire)} кг).`;
        cls = "status-danger";
    }
    
    document.getElementById('tireRes').innerHTML = `<h3 class="${cls}">${msg}</h3>`;
    document.getElementById('tireRes').style.display = 'block';
}
</script>
</body>
</html>
