<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор штрафов — АвтоШтурман</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
<header style="margin-bottom:20px"><a href="index.html" style="color:var(--accent-neon);font-weight:bold;text-decoration:none">← На главную</a></header>
<h1 class="gold-text">👮 Калькулятор стоимости нарушений</h1>
<p class="subtitle">Сколько реально обойдется «парковка в неположенном месте» с учетом эвакуации?</p>

<!-- РАБОЧАЯ КАРТИНКА (Заменена на прямую ссылку для гарантии) -->
<img src="https://images.unsplash.com/photo-1594882645126-14020914d59d?q=80&w=800&auto=format&fit=crop" alt="ГИБДД ночью" style="width:100%; height:250px; object-fit:cover; border-radius:16px; margin-bottom:30px;">

<div class="calc-wrapper">
    <div class="form-group">
        <label>Тип нарушения</label>
        <select id="violationType">
            <option value="parking">Парковка в запретной зоне</option>
            <option value="speed">Превышение скорости >40км/ч</option>
            <option value="red">Проезд на красный</option>
        </select>
    </div>
    <div class="form-group">
        <label>Регион (для расчета эвакуации)</label>
        <select id="region">
            <option value="msk">Москва</option>
            <option value="reg">Другой регион</option>
        </select>
    </div>
    <div class="form-group">
        <label>Сутки хранения на штрафстоянке</label>
        <input type="number" id="daysStored" value="1" min="1">
    </div>
    <button onclick="calcFine()" class="btn-link" style="width:100%">Рассчитать убытки</button>
    <div id="fineRes" class="result-box show" style="display:none;"></div>
</div>
<footer>© 2026 АвтоШтурман</footer>
</div>
<script>
function calcFine() {
    const type = document.getElementById('violationType').value;
    const region = document.getElementById('region').value;
    const days = parseInt(document.getElementById('daysStored').value);
    
    let fineBase = 0;
    let towCost = 0;
    let storageRate = 0;

    if(type === 'parking') fineBase = 1000;
    else if(type === 'speed') fineBase = 1500;
    else if(type === 'red') fineBase = 1000;

    if(region === 'msk') { towCost = 5000; storageRate = 1000; }
    else { towCost = 3000; storageRate = 500; }

    if(type !== 'parking') { towCost = 0; storageRate = 0; } 

    const totalStorage = storageRate * days;
    const totalSum = fineBase + towCost + totalStorage;

    document.getElementById('fineRes').innerHTML = `
        <h3 style="color:#FF4D4D;">ИТОГО ПОТЕРЬ: ${totalSum.toLocaleString('ru-RU')} ₽</h3>
        <ul>
            <li>Штраф ГИБДД: ${fineBase} ₽</li>
            <li>Эвакуатор: ${towCost} ₽</li>
            <li>Хранение (${days} дн.): ${totalStorage} ₽</li>
        </ul>
    `;
    document.getElementById('fineRes').style.display = 'block';
}
</script>
</body>
</html>
